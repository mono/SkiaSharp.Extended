name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

parameters:
  - name: buildAgentWindows
    displayName: 'The Windows validation agent configuration:'
    type: object
    default:
      pool:
        name: ''
        vmImage: windows-2022
        demands: ''
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS validation agent configuration:'
    type: object
    default:
      pool:
        name: ''
        vmImage: macos-15
        demands: ''
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux validation agent configuration:'
    type: object
    default:
      pool:
        name: ''
        vmImage: ubuntu-22.04
        demands: ''
        os: linux

resources:
  pipelines:
    - pipeline: package
      source: '\dotnet\skiasharp\skiasharp-extended-package'
      trigger: true

variables:
  - template: /eng/pipelines/variables.yml@self

jobs:
  - template: /eng/pipelines/jobs/test.yml@self
    parameters:
      expectedSourceCommit: $(resources.pipeline.package.sourceCommit)
      buildAgents:
        Windows: ${{ parameters.buildAgentWindows }}
        macOS: ${{ parameters.buildAgentMac }}
        Linux: ${{ parameters.buildAgentLinux }}
