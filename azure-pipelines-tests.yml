name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: package
      source: '\dotnet\skiasharp\skiasharp-extended-package'
      trigger: true

variables:
  - template: /scripts/azure-pipelines-variables.yml@self
  - name: OfficialBuildId
    value: $(Build.BuildNumber)

jobs:
  - template: /scripts/azure-pipelines-jobs-validation.yml@self
    parameters:
      pack: false
      expectedSourceCommit: $(resources.pipeline.package.sourceCommit)
      platforms:
        Windows:
          os: windows
          pool:
            vmImage: windows-2022
          publish: false
          properties: ''
        macOS:
          os: macos
          pool:
            vmImage: macos-15
          publish: false
          properties: /p:EnableCodeSigning=false
        Linux:
          os: linux
          pool:
            vmImage: ubuntu-22.04
          publish: false
          properties: ''
