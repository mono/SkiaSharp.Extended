parameters:
  - name: pack
    type: boolean
    default: false
  - name: expectedSourceCommit
    type: string
    default: ''
  - name: platforms
    type: object

jobs:
  - ${{ each platform in parameters.platforms }}:
    - template: /eng/common/templates/job/job.yml@self
      parameters:
        name: ${{ platform.key }}
        displayName: Build samples and run tests ${{ platform.key }}
        pool: ${{ platform.value.pool }}
        runAsPublic: true
        timeoutInMinutes: 180
        enablePublishTestResults: true
        testResultsFormat: vstest
        testRunTitle: ${{ platform.key }} unit tests
        artifacts:
          publish:
            logs:
              name: ValidationLogs_${{ platform.key }}
        preSteps:
          - checkout: self
            clean: true
            fetchDepth: 1
          - ${{ if ne(parameters.expectedSourceCommit, '') }}:
            - pwsh: |
                if ($env:EXPECTED_SOURCE_COMMIT -ne $env:BUILD_SOURCEVERSION) {
                  throw "Validation source '$env:BUILD_SOURCEVERSION' does not match package source '$env:EXPECTED_SOURCE_COMMIT'. Select the package run and its matching source ref."
                }
              displayName: Verify package source provenance
              env:
                EXPECTED_SOURCE_COMMIT: ${{ parameters.expectedSourceCommit }}
        steps:
          - template: /scripts/azure-pipelines-steps-prepare.yml@self
            parameters:
              installWasmTools: true
          - ${{ if eq(platform.value.os, 'windows') }}:
            - pwsh: >
                ./eng/common/build.ps1
                -restore -build -test
                -configuration $(_BuildConfig)
                -prepareMachine
                -warnNotAsError "CS0618;CS8600;CS8602;CS8604;CS8605;CS8618;CS8622;CS8625;CS8767;XC0022;XC0025"
                -ci
                -binaryLogName Validation.binlog
                /p:OfficialBuildId=$(OfficialBuildId)
              displayName: Build full solution and run tests
          - ${{ else }}:
            - bash: >
                ./build.sh -test
                -configuration $(_BuildConfig)
                -prepareMachine
                -ci
                -binaryLogName Validation.binlog
                /p:OfficialBuildId=$(OfficialBuildId)
                ${{ platform.value.properties }}
              displayName: Build full solution and run tests
          - ${{ if eq(parameters.pack, true) }}:
            - ${{ if eq(platform.value.os, 'windows') }}:
              - pwsh: >
                  ./eng/common/build.ps1
                  -restore -build -pack -publish
                  -projects "$(Build.SourcesDirectory)\scripts\SkiaSharp.Extended-Pack.slnf"
                  -configuration $(_BuildConfig)
                  -prepareMachine
                  -warnNotAsError "CS0618;CS8600;CS8602;CS8604;CS8605;CS8618;CS8622;CS8625;CS8767;XC0022;XC0025"
                  -ci
                  -binaryLogName Pack.binlog
                  /p:OfficialBuildId=$(OfficialBuildId)
                displayName: Pack shipping products and publish Arcade assets
            - ${{ else }}:
              - bash: >
                  ./build.sh -pack
                  -projects "$(Build.SourcesDirectory)/scripts/SkiaSharp.Extended-Pack.slnf"
                  -configuration $(_BuildConfig)
                  -prepareMachine
                  -ci
                  -binaryLogName Pack.binlog
                  /p:OfficialBuildId=$(OfficialBuildId)
                  ${{ platform.value.properties }}
                displayName: Pack shipping products
            - ${{ if eq(platform.value.publish, false) }}:
              - task: PublishPipelineArtifact@1
                displayName: Publish ${{ platform.key }} packages
                inputs:
                  targetPath: $(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/Shipping
                  artifact: Packages_${{ platform.key }}
                condition: succeeded()
