parameters:
  - name: installWasmTools
    type: boolean
    default: true

steps:
  - task: JavaToolInstaller@0
    displayName: Select JDK 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - pwsh: |
      if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) {
        throw 'JavaToolInstaller did not set JAVA_HOME.'
      }
      Write-Host "##vso[task.setvariable variable=JavaSdkDirectory]$env:JAVA_HOME"
    displayName: Set Java SDK Directory

  - pwsh: |
      $androidSdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
      if ([string]::IsNullOrWhiteSpace($androidSdkRoot)) {
        throw 'The build agent must provide ANDROID_SDK_ROOT or ANDROID_HOME.'
      }

      $sdkManagerName = if ($IsWindows) { 'sdkmanager.bat' } else { 'sdkmanager' }
      $sdkManager = Join-Path $androidSdkRoot "cmdline-tools/latest/bin/$sdkManagerName"
      if (-not (Test-Path $sdkManager)) {
        $sdkManager = Get-ChildItem (Join-Path $androidSdkRoot 'cmdline-tools') -Filter $sdkManagerName -Recurse |
          Select-Object -First 1 -ExpandProperty FullName
      }
      if ([string]::IsNullOrWhiteSpace($sdkManager)) {
        throw "Unable to find $sdkManagerName under '$androidSdkRoot'."
      }

      1..100 | ForEach-Object { 'y' } | & $sdkManager "--sdk_root=$androidSdkRoot" --licenses
      if ($LASTEXITCODE) {
        throw "Android SDK license acceptance failed with exit code $LASTEXITCODE."
      }

      & $sdkManager "--sdk_root=$androidSdkRoot" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmdline-tools;19.0'
      if ($LASTEXITCODE) {
        throw "Android SDK provisioning failed with exit code $LASTEXITCODE."
      }

      Write-Host "##vso[task.setvariable variable=ANDROID_SDK_ROOT]$androidSdkRoot"
      Write-Host "##vso[task.setvariable variable=AndroidSdkDirectory]$androidSdkRoot"
    displayName: Install pinned Android SDK components

  - pwsh: |
      if ($IsMacOS) {
        $xcode = '/Applications/Xcode_26.3.app'
        if (-not (Test-Path $xcode)) {
          throw "The hosted macOS image must provide '$xcode'."
        }
        $env:DEVELOPER_DIR = Join-Path $xcode 'Contents/Developer'
        Write-Host "##vso[task.setvariable variable=DEVELOPER_DIR]$env:DEVELOPER_DIR"

        $xcodeVersion = (& xcodebuild -version | Select-String '^Xcode\s+([0-9.]+)$').Matches.Groups[1].Value
        if ([version]$xcodeVersion -lt [version]'26.3') {
          throw "Xcode 26.3 or later is required by the pinned iOS workload; found '$xcodeVersion'."
        }
      }
    displayName: Select supported Xcode
    condition: eq(variables['Agent.OS'], 'Darwin')

  - pwsh: |
      [string[]] $workloads = if ($IsLinux) { 'maui-android' } else { 'maui' }
      if ('${{ parameters.installWasmTools }}' -eq 'True') {
        $workloads += 'wasm-tools'
      }

      if ($IsWindows) {
        & ./eng/common/dotnet.ps1 workload install @workloads --source https://api.nuget.org/v3/index.json
      } else {
        & ./eng/common/dotnet.sh workload install @workloads --source https://api.nuget.org/v3/index.json
      }
      if ($LASTEXITCODE) {
        throw "Pinned workload installation failed with exit code $LASTEXITCODE."
      }
    displayName: Install pinned SDK and workloads
