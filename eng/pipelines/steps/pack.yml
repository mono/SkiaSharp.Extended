parameters:
  - name: os
    type: string
  - name: publish
    type: boolean
    default: false
  - name: sign
    type: boolean
    default: false
  - name: signType
    type: string
    default: ''
  - name: properties
    type: string
    default: ''
  - name: condition
    type: string
    default: succeeded()

steps:
  - ${{ if eq(parameters.os, 'windows') }}:
    - pwsh: |
        $arguments = @(
          '-restore'
          '-build'
          '-pack'
          '-configuration'
          '$(_BuildConfig)'
          '-prepareMachine'
          '-warnNotAsError'
          '$(LEGACY_WARNINGS_NOT_AS_ERRORS)'
          '-ci'
          '-binaryLogName'
          'Pack.binlog'
          '/p:OfficialBuildId=$(ARCADE_OFFICIAL_BUILD_ID)'
          '/p:BuildShippingOnly=true'
        )
        if ('${{ parameters.publish }}' -eq 'True') {
          $arguments += '-publish'
        }
        if ('${{ parameters.sign }}' -eq 'True') {
          $arguments += '-sign'
          $arguments += '/p:DotNetSignType=${{ parameters.signType }}'
        }
        if ('${{ parameters.properties }}') {
          $arguments += '${{ parameters.properties }}'
        }

        & ./eng/common/build.ps1 @arguments
        if ($LASTEXITCODE) {
          throw "Arcade packaging failed with exit code $LASTEXITCODE."
        }
      displayName: Build and pack shipping products
      condition: ${{ parameters.condition }}

  - ${{ else }}:
    - bash: |
        args=(
          -restore
          -build
          -pack
          -configuration "$(_BuildConfig)"
          -prepareMachine
          -warnNotAsError "$(LEGACY_WARNINGS_NOT_AS_ERRORS)"
          -ci
          -binaryLogName Pack.binlog
          "/p:OfficialBuildId=$(ARCADE_OFFICIAL_BUILD_ID)"
          /p:BuildShippingOnly=true
        )
        if [[ '${{ parameters.publish }}' == 'True' ]]; then
          args+=(-publish)
        fi
        if [[ '${{ parameters.sign }}' == 'True' ]]; then
          args+=(-sign "/p:DotNetSignType=${{ parameters.signType }}")
        fi
        if [[ -n '${{ parameters.properties }}' ]]; then
          args+=('${{ parameters.properties }}')
        fi

        ./eng/common/build.sh "${args[@]}"
      displayName: Build and pack shipping products
      condition: ${{ parameters.condition }}
