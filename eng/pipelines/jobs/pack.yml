parameters:
  - name: buildAgents
    type: object

jobs:
  - ${{ each buildAgent in parameters.buildAgents }}:
    - template: /eng/common/templates/job/job.yml@self
      parameters:
        name: Pack_${{ buildAgent.key }}
        displayName: Pack shipping products ${{ buildAgent.key }}
        pool:
          ${{ if ne(buildAgent.value.pool.name, '') }}:
            name: ${{ buildAgent.value.pool.name }}
          ${{ if ne(buildAgent.value.pool.vmImage, '') }}:
            vmImage: ${{ buildAgent.value.pool.vmImage }}
          ${{ if ne(buildAgent.value.pool.demands, '') }}:
            demands: ${{ buildAgent.value.pool.demands }}
        runAsPublic: true
        timeoutInMinutes: 180
        artifacts:
          publish:
            logs:
              name: PackLogs_${{ buildAgent.key }}
        preSteps:
          - checkout: self
            clean: true
            fetchDepth: 1
        steps:
          - template: /eng/pipelines/steps/setup.yml@self
            parameters:
              installWasmTools: false
          - template: /eng/pipelines/steps/pack.yml@self
            parameters:
              os: ${{ buildAgent.value.pool.os }}
              ${{ if eq(buildAgent.value.pool.os, 'windows') }}:
                publish: true
              ${{ if eq(buildAgent.value.pool.os, 'macos') }}:
                properties: /p:EnableCodeSigning=false
          - ${{ if ne(buildAgent.value.pool.os, 'windows') }}:
            - task: PublishPipelineArtifact@1
              displayName: Publish ${{ buildAgent.key }} packages
              inputs:
                targetPath: $(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/Shipping
                artifact: Packages_${{ buildAgent.key }}
              condition: succeeded()
