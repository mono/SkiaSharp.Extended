name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: ./eng/common/dotnet.sh tool restore

      - name: Configure platform SDKs
        shell: pwsh
        run: ./eng/configure-platform.ps1

      - name: Install pinned workloads
        run: |
          ./eng/common/dotnet.sh workload install maui-android wasm-tools \
            --version 10.0.203 \
            --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json

      - name: Verify build
        run: ./build.sh -test -configuration Release

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-build-logs
          path: |
            artifacts/log/Release
            artifacts/TestResults/Release
          retention-days: 5
