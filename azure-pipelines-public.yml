trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - CODE-OF-CONDUCT.md
      - LICENSE
      - .github/
      - docs/

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - CODE-OF-CONDUCT.md
      - LICENSE
      - .github/
      - docs/
      - images/

variables:
  - template: /scripts/azure-pipelines-variables.yml@self

pool:
  vmImage: windows-latest

jobs:
  - job: build
    displayName: Build
    steps:
      - template: /scripts/azure-pipelines-steps-prepare.yml@self
      - pwsh: dotnet cake --target=build
        displayName: Build everything
      - publish: output
        artifact: build
        condition: always()
        displayName: Upload Logs

  - job: pack
    displayName: Pack
    steps:
      - template: /scripts/azure-pipelines-steps-prepare.yml@self
      - pwsh: dotnet cake --target=pack
        displayName: Pack NuGet packages
      - publish: output
        artifact: pack
        condition: always()
        displayName: Upload Logs

  - job: test
    displayName: Test
    steps:
      - template: /scripts/azure-pipelines-steps-prepare.yml@self
      - pwsh: dotnet cake --target=test
        displayName: Run tests
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: output/test-results/*.trx
      - publish: output
        artifact: test
        condition: always()
        displayName: Upload Logs

  - job: api_compat
    displayName: API Compatibility Check
    dependsOn: test
    pool:
      vmImage: windows-latest
    steps:
      - checkout: self
      - pwsh: dotnet tool restore
        displayName: Restore .NET tools
      - pwsh: dotnet build source/SkiaSharp.Drawing/SkiaSharp.Drawing.csproj -c Release
        displayName: Build SkiaSharp.Drawing
      - pwsh: >-
          dotnet apicompat
          --left tools/api-baseline/netstandard2.0/System.Drawing.Common.dll
          --right source/SkiaSharp.Drawing/bin/Release/netstandard2.0/System.Drawing.Common.dll
          --strict-mode
          --suppression-file tools/api-baseline/api-compat-suppressions.xml
        displayName: Run API compatibility check

  - job: generate_references
    displayName: Generate Reference Images
    pool:
      vmImage: windows-latest
    steps:
      - template: /scripts/azure-pipelines-steps-prepare.yml@self
      - pwsh: |
          $env:SCENARIO_OUTPUT_PATH = "$(Build.ArtifactStagingDirectory)/reference-images"
          $env:SCENARIO_SUFFIX = "gdi"
          dotnet test tests/SkiaSharp.Drawing.ReferenceGenerator --nologo
        displayName: Generate GDI+ reference images
      - publish: $(Build.ArtifactStagingDirectory)/reference-images
        artifact: reference-images
        displayName: Upload GDI+ reference images

  - job: pixel_validation
    displayName: Pixel Validation (3-step)
    dependsOn: generate_references
    pool:
      vmImage: windows-latest
    steps:
      - template: /scripts/azure-pipelines-steps-prepare.yml@self
      - download: current
        artifact: reference-images
      - pwsh: |
          # Step 1: GDI reference stability (fresh GDI vs checked-in .gdi.png)
          $env:FRESH_GDI_IMAGES_PATH = "$(Pipeline.Workspace)/reference-images"
          $env:TEST_ARTIFACTS_PATH = "$(Build.ArtifactStagingDirectory)/diff-images"
          dotnet test tests/SkiaSharp.Drawing.Tests --filter "FullyQualifiedName~GdiReferenceStability" --logger trx --results-directory "$(Build.ArtifactStagingDirectory)/test-results"
        displayName: "Step 1: GDI reference stability"
      - pwsh: |
          # Step 2: Skia regression (fresh Skia vs checked-in .skia.png)
          $env:TEST_ARTIFACTS_PATH = "$(Build.ArtifactStagingDirectory)/diff-images"
          dotnet test tests/SkiaSharp.Drawing.Tests --filter "FullyQualifiedName~SkiaRegression" --logger trx --results-directory "$(Build.ArtifactStagingDirectory)/test-results"
        displayName: "Step 2: Skia regression"
      - pwsh: |
          # Step 3: Skia == GDI comparison (pixel compatibility)
          $env:TEST_ARTIFACTS_PATH = "$(Build.ArtifactStagingDirectory)/diff-images"
          dotnet test tests/SkiaSharp.Drawing.Tests --filter "FullyQualifiedName~PixelCompatibilityComparison" --logger trx --results-directory "$(Build.ArtifactStagingDirectory)/test-results"
        displayName: "Step 3: Skia == GDI pixel compatibility"
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: $(Build.ArtifactStagingDirectory)/test-results/*.trx
          testRunTitle: Pixel Validation
      - publish: $(Build.ArtifactStagingDirectory)/diff-images
        artifact: diff-images
        condition: always()
        displayName: Upload diff images
      - publish: $(Build.ArtifactStagingDirectory)/test-results
        artifact: pixel-validation-results
        condition: always()
        displayName: Upload test results
