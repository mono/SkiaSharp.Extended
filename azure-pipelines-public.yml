name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - README.md
      - CODE-OF-CONDUCT.md
      - LICENSE
      - .github/
      - docs/

pr:
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - README.md
      - CODE-OF-CONDUCT.md
      - LICENSE
      - .github/
      - docs/
      - images/

parameters:
  - name: buildAgentWindows
    displayName: 'The Windows validation agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        vmImage: ''
        demands: ImageOverride -equals windows.vs2026.amd64.open
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS validation agent configuration:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-15
        demands: ''
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux validation agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        vmImage: ''
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux

variables:
  - template: /eng/common/templates/variables/pool-providers.yml@self
  - template: /eng/pipelines/variables.yml@self

jobs:
  - template: /eng/pipelines/jobs/test.yml@self
    parameters:
      buildAgents:
        Windows: ${{ parameters.buildAgentWindows }}
        macOS: ${{ parameters.buildAgentMac }}
        Linux: ${{ parameters.buildAgentLinux }}

  - template: /eng/pipelines/jobs/pack.yml@self
    parameters:
      buildAgents:
        Windows: ${{ parameters.buildAgentWindows }}
        macOS: ${{ parameters.buildAgentMac }}
        Linux: ${{ parameters.buildAgentLinux }}
