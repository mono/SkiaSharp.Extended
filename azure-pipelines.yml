name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - .github/**
      - docs/**
      - README.md

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily main build
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngInternalBuildPool)
        image: 1es-windows-2022
        os: windows
  - name: runApiScan
    displayName: 'Run API Scan for this build (scheduled main builds run automatically)'
    type: boolean
    default: false
  - name: forceRealSigning
    displayName: 'Ignore branch selection and force ESRP real signing'
    type: boolean
    default: false
  - name: registerInBar
    displayName: Register a forced real-sign build in BAR
    type: boolean
    default: false

variables:
  - template: /eng/common/templates-official/variables/pool-providers.yml@self
  - template: /eng/pipelines/variables.yml@self

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.buildAgentWindows.pool }}
    settings:
      networkIsolationMode: Audit
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      armory:
        break: true
      binskim:
        enabled: true
        break: true
      codeql:
        compiled:
          enabled: true
        enabledOnNonDefaultBranches: true
      codeInspector:
        enabled: true
      credscan:
        enabled: true
        break: true
      eslint:
        break: true
      policheck:
        enabled: true
        break: true
      psscriptanalyzer:
        enabled: true
        break: true
      spotBugs:
        enabled: false
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/.config/tsaoptions.json
    stages:
      - ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/pull/'))) }}:
        - template: /eng/pipelines/stages/package.yml@self
          parameters:
            buildAgentWindows: ${{ parameters.buildAgentWindows }}
            ${{ if or(eq(parameters.forceRealSigning, 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
              useRealSigning: true
            ${{ else }}:
              useRealSigning: false
            ${{ if or(and(eq(parameters.forceRealSigning, 'true'), eq(parameters.registerInBar, 'true')), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
              publishAssets: true
            ${{ else }}:
              publishAssets: false

        - ${{ if or(eq(parameters.runApiScan, true), and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Schedule'))) }}:
          - template: /eng/pipelines/stages/api-scan.yml@self
            parameters:
              buildAgent: ${{ parameters.buildAgentWindows }}

        - ${{ if or(and(eq(parameters.forceRealSigning, 'true'), eq(parameters.registerInBar, 'true')), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
          - template: /eng/common/templates-official/post-build/post-build.yml@self
            parameters:
              publishingInfraVersion: 3
              publishAssetsImmediately: false
              requireDefaultChannels: true
              validateDependsOn:
                - package
                - ${{ if or(eq(parameters.runApiScan, true), and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Schedule'))) }}:
                  - api_scan
