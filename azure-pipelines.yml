trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - .github/**
      - docs/**
      - README.md

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily main build
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgent
    displayName: 'The Windows build agent configuration'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: packageLabel
    displayName: 'Package label'
    type: string
    default: preview
    values:
      - preview
      - stable
  - name: runApiScan
    displayName: 'Run API Scan for this build'
    type: boolean
    default: false
  - name: forceRealSigning
    displayName: 'Force real signing on a trusted feature build'
    type: boolean
    default: false
  - name: registerInBar
    displayName: 'Register a forced real-sign build in BAR'
    type: boolean
    default: false

variables:
  - template: /scripts/azure-pipelines-variables.yml@self
  - name: PREVIEW_LABEL
    value: ${{ parameters.packageLabel }}

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.buildAgent.pool }}
    settings:
      networkIsolationMode: Audit
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      armory:
        break: true
      binskim:
        enabled: true
        break: true
      codeql:
        compiled:
          enabled: true
        enabledOnNonDefaultBranches: true
      codeInspector:
        enabled: true
      credscan:
        enabled: true
        break: true
      eslint:
        break: true
      policheck:
        enabled: true
        break: true
      psscriptanalyzer:
        enabled: true
        break: true
      spotBugs:
        enabled: false
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/.config/tsaoptions.json
    stages:
      - stage: package
        displayName: Build and package
        jobs:
          - job: package
            displayName: Build and package NuGets
            timeoutInMinutes: 180
            templateContext:
              outputParentDirectory: output
              outputs:
                - output: pipelineArtifact
                  displayName: Publish NuGet packages
                  artifactName: nuget
                  targetPath: output/nugets
                - output: pipelineArtifact
                  displayName: Publish Arcade Shipping assets
                  artifactName: arcade_shipping
                  targetPath: output/arcade-assets/Shipping
                - output: pipelineArtifact
                  displayName: Publish Arcade NonShipping assets
                  artifactName: arcade_nonshipping
                  targetPath: output/arcade-assets/NonShipping
                - output: pipelineArtifact
                  displayName: Publish loose PDBs
                  artifactName: PdbArtifacts
                  targetPath: output/pdbs
                  isProduction: false
                - output: pipelineArtifact
                  displayName: Publish package logs
                  artifactName: package_logs
                  targetPath: output/binlogs
                  condition: always()
                  isProduction: false
            steps:
              - template: /scripts/azure-pipelines-steps-prepare.yml@self
              - pwsh: ./scripts/infra/tests/SetBuildVariables.Tests.ps1
                displayName: Validate build identity
              - pwsh: ./scripts/infra/tests/AssembleArcadeAssets.Tests.ps1
                displayName: Validate Arcade asset assembly
              - pwsh: dotnet cake --target=pack
                displayName: Pack NuGets
              - pwsh: ./scripts/infra/assemble-arcade-assets.ps1 -OutputRoot ./output
                displayName: Assemble Arcade assets

      - ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/pull/'))) }}:
        - template: /scripts/azure-pipelines-stages-signing.yml@self
          parameters:
            buildAgent: ${{ parameters.buildAgent }}
            ${{ if or(eq(parameters.forceRealSigning, 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
              useRealSigning: true
            ${{ else }}:
              useRealSigning: false
            ${{ if or(and(eq(parameters.forceRealSigning, 'true'), eq(parameters.registerInBar, 'true')), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
              publishAssets: true
            ${{ else }}:
              publishAssets: false

        - ${{ if or(eq(parameters.runApiScan, 'true'), and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Schedule'))) }}:
          - template: /scripts/azure-pipelines-stages-apiscan.yml@self
            parameters:
              buildAgent: ${{ parameters.buildAgent }}
